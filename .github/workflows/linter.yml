name: ESLint
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '23.8'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: pnpm install
      - name: ESLint
        run: pnpm lint
